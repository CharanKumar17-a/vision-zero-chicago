version: 1

sources:
  crashes:
    source_name: Chicago Traffic Crashes - Crashes
    owner: City of Chicago
    dataset_id: 85ca-t3if
    page_url: https://data.cityofchicago.org/Transportation/Traffic-Crashes-Crashes/85ca-t3if
    api_url: https://data.cityofchicago.org/resource/85ca-t3if.json
    metadata_url: https://data.cityofchicago.org/api/views/85ca-t3if
    expected_grain: one row per recorded crash
    primary_key: crash_record_id
    relationship_to_crashes: primary_table
    required_fields:
      - crash_record_id
      - crash_date
      - most_severe_injury
      - injuries_total
      - injuries_fatal
      - injuries_incapacitating
      - latitude
      - longitude
    status: verified_api_access

  vehicles:
    source_name: Chicago Traffic Crashes - Vehicles
    owner: City of Chicago
    dataset_id: 68nd-jvt3
    page_url: https://data.cityofchicago.org/Transportation/Traffic-Crashes-Vehicles/68nd-jvt3
    api_url: https://data.cityofchicago.org/resource/68nd-jvt3.json
    metadata_url: https://data.cityofchicago.org/api/views/68nd-jvt3
    expected_grain: one row per vehicle or traffic unit involved in a crash
    primary_key: crash_unit_id
    join_key: crash_record_id
    relationship_to_crashes: many_to_one
    required_fields:
      - crash_unit_id
      - crash_record_id
      - crash_date
      - unit_type
      - num_passengers
      - vehicle_type
    status: verified_api_access

  people:
    source_name: Chicago Traffic Crashes - People
    owner: City of Chicago
    dataset_id: u6pd-qa9d
    page_url: https://data.cityofchicago.org/Transportation/Traffic-Crashes-People/u6pd-qa9d
    api_url: https://data.cityofchicago.org/resource/u6pd-qa9d.json
    metadata_url: https://data.cityofchicago.org/api/views/u6pd-qa9d
    expected_grain: one row per person involved in a crash
    primary_key: person_id
    join_key: crash_record_id
    relationship_to_crashes: many_to_one
    required_fields:
      - person_id
      - person_type
      - crash_record_id
      - crash_date
      - injury_classification
      - age
    status: verified_api_access

corridor_sources:
  high_crash_corridor_plan:
    source_name: Chicago Vision Zero High Crash Corridors Framework Plan
    source_type: official_pdf
    publisher: City of Chicago
    document_url: https://www.chicago.gov/content/dam/city/sites/complete-streets/pdfs/06-28-18%20VZ_HCC_FrameworkPlan_reduced%20size.pdf
    expected_grain: one official planning document defining 43 high-crash corridors
    verification_status: verified_source_access_pending_geometry
    geometry_validation_required: true
    evidence_path: docs/data_quality/corridor_source_verification.txt

  street_center_lines:
    source_name: Chicago Street Center Lines
    source_type: socrata_geospatial
    publisher: City of Chicago

    dataset_id: 6imu-meau
    map_view_id: 6imu-meau
    backing_dataset_id: pr57-gg9e

    page_url: https://data.cityofchicago.org/Transportation/Street-Center-Lines/6imu-meau
    metadata_url: https://data.cityofchicago.org/api/views/6imu-meau
    backing_metadata_url: https://data.cityofchicago.org/api/views/pr57-gg9e
    geojson_url: https://data.cityofchicago.org/resource/pr57-gg9e.geojson
    count_url: https://data.cityofchicago.org/resource/pr57-gg9e.json

    legacy_map_export_url: https://data.cityofchicago.org/api/geospatial/6imu-meau?method=export&format=GeoJSON
    legacy_map_export_status: rejected_incomplete_response

    expected_grain: one row per street centerline segment
    primary_key: objectid

    required_fields:
      - objectid
      - trans_id
      - fnode_id
      - tnode_id
      - pre_dir
      - street_nam
      - street_typ
      - suf_dir
      - f_cross
      - t_cross
      - status
      - length

    expected_geometry_types:
      - MultiLineString
      - LineString

    verification_status: verified_backing_api_access_pending_snapshot
    geometry_validation_required: true
    evidence_path: docs/data_quality/corridor_source_verification.txt

