version: 1

source:
  document: high_crash_corridor_framework_plan.pdf
  canonical_page: 9
  cross_reference_pages:
    - 27
    - 28
    - 29
  canonical_policy: >
    Page 9 of the High Crash Corridors Framework Plan (June 2018) is the
    authoritative source for corridor names and published FROM/TO boundaries.
    Pages 27 through 29 are cross-reference evidence used to validate
    endpoints and sub-segment continuity. Where pages 27-29 reverse the
    FROM/TO direction, page 9 governs. Where pages 27-29 introduce
    intermediate split points, these are project-delivery sub-segments and
    do not extend or redefine the corridor boundaries.
  extraction_method: structured_transcription_from_verified_plan
  require_second_pass_verification: true
  allow_silent_boundary_inference: false

cross_reference_summary:
  total_corridors: 43
  same_direction_matches: 20
  reversed_direction_matches: 23
  endpoint_disagreements: 0
  multi_segment_chains: 16
  chain_breaks: 0

id_mapping:
  neighborhood_id_offset: 0
  downtown_id_offset: 31
  id_prefix: HCC
  id_width: 3
  first_id: HCC001
  last_id: HCC043
  rule: >
    neighborhood source number N maps to HCC with zero-padded (N).
    downtown source number D maps to HCC with zero-padded (D + 31).

