version: 1

dataset:
  name: corridor_month_features
  input_path: data/processed/corridor_month_panel.parquet
  output_path: data/processed/corridor_month_features.parquet
  validation_report_path: docs/data_quality/corridor_month_features_validation.json
  runs_directory: docs/data_quality/corridor_month_features_runs

targets:
  primary_target: total_crashes
  secondary_target: ksi_crashes
  all_target_columns:
    - total_crashes
    - ksi_crashes

features:
  targets_evaluated:
    - total_crashes
    - ksi_crashes

  lag_months:
    - 1
    - 3
    - 6
    - 12

  rolling_windows:
    - 3
    - 6
    - 12

  minimum_history_months: 12

  static_metadata_predictors:
    - corridor_length_feet
    - corridor_length_miles

  temporal_predictors:
    - calendar_month
    - calendar_quarter
    - calendar_year_trend
    - month_sin
    - month_cos

chronological_split:
  split_policy: time_based_only
  allow_random_split: false
  allow_future_observations_in_predictors: false

  periods:
    warmup:
      start: "2018-01-01"
      end: "2018-12-01"
      months: 12
      expected_rows: 516
      model_ready: false

    train:
      start: "2019-01-01"
      end: "2023-12-01"
      months: 60
      expected_rows: 2580
      model_ready: true

    validation:
      start: "2024-01-01"
      end: "2024-12-01"
      months: 12
      expected_rows: 516
      model_ready: true

    test:
      start: "2025-01-01"
      end: "2025-12-01"
      months: 12
      expected_rows: 516
      model_ready: true

  expected_total_rows: 4128
  expected_model_ready_rows: 3612

modeling:
  candidate_models:
    - seasonal_naive_lag12
    - historical_rolling_mean_12
    - poisson_regression
    - negative_binomial_glm

  selection_metric: mean_poisson_deviance

  evaluation_metrics:
    - mae
    - rmse
    - mean_poisson_deviance
    - mean_bias
    - calibration_ratio
    - spearman_rank_correlation

  prediction_floor: 1e-6
  random_seed: 42

  outputs:
    models_dir: outputs/models
    total_crashes_model_path: outputs/models/total_crashes_selected_model.joblib
    ksi_crashes_model_path: outputs/models/ksi_crashes_selected_model.joblib
    validation_predictions_path: outputs/forecasts/model_validation_predictions.parquet
    test_predictions_path: outputs/forecasts/model_test_predictions.parquet
    model_comparison_path: outputs/tables/model_comparison.csv
    validation_report_path: docs/data_quality/crash_risk_model_validation.json
    runs_directory: docs/data_quality/crash_risk_model_runs

evaluation:
  forecast_horizon_months: 1
  protocol: rolling_origin_observed_history
  fixed_origin_annual_forecast_status: not_yet_built
  calibration_warning_relative_error: 0.10
